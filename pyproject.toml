[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa-harness"  # PyPI-Name "sherpa" ist vergeben; Import-Paket und CLI bleiben "sherpa" (ADR-0009)
version = "0.2.0"
description = "Generischer Harness-Generator: Codebase ingestieren, Owner/Agents/Skills planen, nach Freigabe anlegen."
license = "LicenseRef-Proprietary"  # ADR-0010: proprietär bis zum öffentlichen Release
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sherpa = "sherpa.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sherpa = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # Fixture-Literale (Manifest-Inhalte) sind absichtlich lang
