  <text x="458" y="25" text-anchor="middle" fill="#8b949e">sherparc/Sherpa on itself — 2026-09-19</text>
  <text x="18" y="72" xml:space="preserve" fill="#79c0ff"><tspan fill="#79c0ff">$ sherpa plan .</tspan></text>
  <text x="18" y="91" xml:space="preserve" fill="#c9d1d9"><tspan fill="#c9d1d9">harness-plan.yaml — 5 proposals, 4 reasoned no's</tspan></text>
  <text x="18" y="110" xml:space="preserve" fill="#3fb950"><tspan fill="#3fb950">  + outcome    Sherpa            mandatory: no harness without an outcome signal (ADR-0008) </tspan><tspan fill="#3fb950">✓</tspan></text>
  <text x="18" y="129" xml:space="preserve" fill="#3fb950"><tspan fill="#3fb950">  + owner-doc  sherparc          44 commits/90d, 0 dependents </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 178 files </tspan><tspan fill="#3fb950">✓</tspan></text>
  <text x="18" y="148" xml:space="preserve" fill="#3fb950"><tspan fill="#3fb950">  + owner-doc  src/sherpa/apply  21 commits/90d, 0 dependents </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 7 files </tspan><tspan fill="#3fb950">✓</tspan></text>
  <text x="18" y="167" xml:space="preserve" fill="#3fb950"><tspan fill="#3fb950">  + agent      sherparc          rank 1/4 churn </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 44 commits/90d </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 178 files </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 2 authors </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> [reject]</tspan></text>
  <text x="18" y="186" xml:space="preserve" fill="#3fb950"><tspan fill="#3fb950">  + librarian  sherparc          rank 1/4 momentum </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#3fb950"> · 44 commits/30d, 44/90d </tspan><tspan fill="#3fb950">✓</tspan></text>
  <text x="18" y="205" xml:space="preserve" fill="#f85149"><tspan fill="#f85149">  - owner-doc  src/sherpa/plan   10 commits/90d, 0 dependents </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#f85149"> · 3 files </tspan><tspan fill="#f85149">✗</tspan></text>
  <text x="18" y="224" xml:space="preserve" fill="#f85149"><tspan fill="#f85149">  - owner-doc  src/sherpa/scan   8 commits/90d, 0 dependents </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#f85149"> · 4 files </tspan><tspan fill="#f85149">✗</tspan></text>
  <text x="18" y="243" xml:space="preserve" fill="#f85149"><tspan fill="#f85149">  - agent      src/sherpa/apply  rank 2/4 churn </tspan><tspan fill="#f85149">✗</tspan><tspan fill="#f85149"> · 21 commits/90d </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#f85149"> · 7 files </tspan><tspan fill="#f85149">✗</tspan><tspan fill="#f85149"> · 1 authors </tspan><tspan fill="#f85149">✗</tspan></text>
  <text x="18" y="262" xml:space="preserve" fill="#f85149"><tspan fill="#f85149">  - librarian  src/sherpa/apply  rank 2/4 momentum </tspan><tspan fill="#3fb950">✓</tspan><tspan fill="#f85149"> · 21 commits/30d, 21/90d </tspan><tspan fill="#f85149">✗</tspan></text>
  <text x="18" y="281" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">  3 sub-units of sherparc by the depth rule (depth 3): src/sherpa/apply, src/sherpa/plan, src/sherpa/scan —</tspan></text>
  <text x="18" y="300" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">    [plan] units in sherpa.toml overrides the rule.</tspan></text>
  <text x="18" y="319" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">  2 small units without owner doc (&lt; 5 files, 0 dependents): src/sherpa/plan, src/sherpa/scan — listed above as</tspan></text>
  <text x="18" y="338" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">    no's; owner_doc_min_files in sherpa.toml [plan] moves the floor, a dependent overrides it.</tspan></text>
  <text x="18" y="357" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">  not listed, out of reach: 2 units for agent (rank &gt; 1 and &lt; 20 commits/90d), 2 for librarian (rank &gt; 2 and</tspan></text>
  <text x="18" y="376" xml:space="preserve" fill="#8b949e"><tspan fill="#8b949e">    below both floors).</tspan></text>
  <text x="18" y="395" xml:space="preserve" fill="#d2a8ff"><tspan fill="#d2a8ff">→ .sherpa/harness-plan.yaml (1 decisions kept)</tspan></text>
