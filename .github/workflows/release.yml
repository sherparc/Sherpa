# Release: a tag v<version> → tests → wheel + sdist → GitHub release with the wheel attached (ADR-0018).
# The tag must match the version in pyproject.toml and src/sherpa/__init__.py — the job refuses otherwise.
# `sherpa self-update` reads the latest release through the API; the repository is private until the public
# release (ADR-0010), so users need a token (`gh auth login`) or the git URL fallback.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the wheel

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/sherpa/__init__.py').read_text()).group(1))")
          toml=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$py" -a "$tag" = "$toml" || { echo "tag v$tag vs __init__ $py vs pyproject $toml"; exit 1; }
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q --cov=sherpa --cov-fail-under=90
      - run: ruff check . && ruff format --check .
      - run: python -m build
      - name: the wheel installs and runs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/sherpa --version
          /tmp/v/bin/sherpa doctor --offline . || true  # a checkout without origin/HEAD is only a hint, not a failure
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --title "sherpa $GITHUB_REF_NAME" --generate-notes
