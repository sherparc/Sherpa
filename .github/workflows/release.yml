# Release: a tag v<version> → tests → wheel + sdist → GitHub release with the wheel attached (ADR-0018) → the
# same files on PyPI through trusted publishing (ADR-0053: no token in the repository, the `pypi` environment is
# the publisher registered on pypi.org). The tag must match the version in pyproject.toml and
# src/sherpa/__init__.py and must not be on the index yet — the job refuses otherwise. `sherpa self-update`
# reads PyPI first, the GitHub release with a token or the newest tag by `git ls-remote` when the index is silent.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the release and upload the wheel
  id-token: write  # trusted publishing: PyPI verifies the OIDC token of this workflow, no API token anywhere

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi  # the name the trusted publisher on pypi.org is registered with
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/sherpa/__init__.py').read_text()).group(1))")
          toml=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$py" -a "$tag" = "$toml" || { echo "tag v$tag vs __init__ $py vs pyproject $toml"; exit 1; }
      - name: the version is not on PyPI yet
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/sherpa-harness/${GITHUB_REF_NAME#v}/json")
          test "$code" = "404" || { echo "sherpa-harness ${GITHUB_REF_NAME#v} answers $code on PyPI — a version is published once"; exit 1; }
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q --cov=sherpa --cov-fail-under=90
      - run: ruff check . && ruff format --check .
      - run: python -m build
      - name: the wheel installs and runs
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl
          /tmp/v/bin/sherpa --version
          /tmp/v/bin/sherpa doctor --offline . || true  # a checkout without origin/HEAD is only a hint, not a failure
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub can start two runs for one tag push; the second finds the release and leaves it alone.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — nothing to do"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --title "sherpa $GITHUB_REF_NAME" --generate-notes
          fi
      - name: PyPI
        # after the GitHub release, so a publisher not yet registered on pypi.org leaves a usable release behind
        uses: pypa/gh-action-pypi-publish@release/v1
