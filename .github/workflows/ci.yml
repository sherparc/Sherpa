# CI: tests + coverage gate + lint + the end-to-end theses (docs/plan.md §5). Minutes count 1x Linux, 2x Windows,
# 10x macOS (ADR-0043), so the matrix follows the event:
#   pull request            → Linux only (the fast signal for every commit on a branch)
#   push to main            → Linux + Windows (customer machines, git paths and \r\n break T0/T1 first)
#   Monday 06:00 UTC        → macOS only (arm64 customer laptops, once a week on main)
#   workflow_dispatch       → all three, for a large change to git/path/encoding logic before it merges
# Docs-only changes do not run it; a newer push to the same branch cancels the older run; every job has a cap.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "kb-sherpa/**", ".claude/**", ".githooks/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "kb-sherpa/**", ".claude/**", ".githooks/**", "LICENSE"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # schedule → macOS; dispatch → all; push (main) → Linux + Windows; pull request → Linux
        os: ${{ fromJSON(github.event_name == 'schedule' && '["macos-latest"]' || github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=sherpa --cov-report=term-missing --cov-fail-under=90

  e2e:
    # The theses of README, CLAUDE.md and the ADRs against the sherpa command on the built-in corpus (ADR-0055):
    # the same matrix as the unit tests, one Python — the product is measured, not the interpreter.
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || github.event_name == 'push' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/e2e -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
