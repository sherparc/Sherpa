# CI: tests + coverage gate + lint on Linux, Windows and macOS (docs/plan.md §5).
# Windows is mandatory: customer machines, git paths and \r\n are the typical breaking points of T0/T1.
# macOS (arm64): customer laptops; counts 10x against the minutes quota on private repos. Off by default,
# enable only for large changes (git/path/encoding logic): uncomment macos-latest in the matrix.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # , macos-latest
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=sherpa --cov-report=term-missing --cov-fail-under=90

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
